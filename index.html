<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI带我学AI · 2608 俞丁悦</title>
<style>
  :root {
    --bg: #041018;
    --ink: #e7f6ff;
    --muted: #8eb4c6;
    --cyan: #5ce1ff;
    --line: rgba(92, 225, 255, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    color: var(--ink);
    background: radial-gradient(1200px 700px at 50% -10%, #0c3048 0%, var(--bg) 55%);
    font-family: "等线", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 17px;
    line-height: 1.75;
  }
  /* 水纹画在最底层，不挡住点击 */
  #water {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 48px 22px 80px;
  }
  .kicker {
    margin: 0 0 8px;
    font-family: Consolas, "Cascadia Mono", monospace;
    letter-spacing: 0.28em;
    font-size: 12px;
    color: var(--cyan);
  }
  h1 {
    margin: 0;
    font-size: 44px;
    letter-spacing: 0.12em;
    line-height: 1.15;
    text-shadow: 0 0 24px rgba(92, 225, 255, 0.35);
  }
  .by { margin: 8px 0 28px; color: var(--muted); font-size: 14px; }
  .qlist { display: flex; flex-direction: column; gap: 12px; }
  .q {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    color: var(--ink);
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    background: rgba(6, 24, 38, 0.55);
    backdrop-filter: blur(8px);
    box-shadow: inset 0 0 24px rgba(92, 225, 255, 0.05), 0 8px 28px rgba(0, 0, 0, 0.25);
    font: inherit;
    font-size: 18px;
  }
  .q:hover {
    border-color: var(--cyan);
    box-shadow: 0 0 22px rgba(92, 225, 255, 0.22);
  }
  .no {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-family: Consolas, monospace;
    font-size: 13px;
  }
  .go { margin-left: auto; color: var(--cyan); font-size: 13px; letter-spacing: 0.08em; }
  .view { display: none; }
  .view.on { display: block; }
  .back {
    margin-bottom: 18px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--cyan);
    border-radius: 999px;
    padding: 6px 14px;
    font: inherit;
    cursor: pointer;
  }
  h2 { margin: 0 0 12px; font-size: 26px; letter-spacing: 0.04em; }
  p { margin: 0 0 12px; }
  .panel {
    margin: 14px 0 18px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: rgba(5, 20, 34, 0.62);
    backdrop-filter: blur(10px);
  }
  .panel h3 { margin: 0 0 12px; text-align: center; font-size: 18px; color: var(--cyan); }
  .api {
    display: grid;
    grid-template-columns: 1fr 140px 1fr;
    gap: 8px;
    align-items: center;
  }
  .node, .nav button, .more, .reveal {
    font: inherit;
    cursor: pointer;
    color: var(--ink);
  }
  .node {
    border: 1px solid var(--cyan);
    border-radius: 14px;
    background: rgba(8, 32, 48, 0.8);
    padding: 14px 12px;
    font-weight: 700;
  }
  .node small { display: block; margin-top: 6px; font-weight: 500; color: var(--muted); font-size: 12px; }
  .node.on { box-shadow: 0 0 18px rgba(92, 225, 255, 0.45); }
  .prompt {
    display: inline-block;
    border: 1px solid var(--cyan);
    border-radius: 6px;
    padding: 0 6px;
    margin-right: 6px;
    font-family: Consolas, monospace;
    color: var(--cyan);
  }
  .server { text-align: center; }
  .model {
    margin-top: 8px;
    border: 1px solid #7aa2ff;
    border-radius: 8px;
    padding: 4px 8px;
    color: #c9dcff;
  }
  .lanes { position: relative; height: 78px; }
  .lane { position: absolute; left: 0; right: 0; height: 28px; }
  .lane.go { top: 4px; }
  .lane.back { bottom: 2px; }
  .lane .label { font-size: 12px; }
  .lane.go .label { color: #7ad7ff; }
  .lane.back .label { color: #8dffa8; float: right; }
  .packet {
    position: absolute;
    top: 16px;
    width: 48px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: #041018;
    border-radius: 999px;
    opacity: 0;
  }
  .lane.go .packet { background: #5ce1ff; left: 0; }
  .lane.back .packet { background: #8dffa8; right: 0; }
  .lane.go.fly .packet { animation: to-right 0.7s ease forwards; }
  .lane.back.fly .packet { animation: to-left 0.7s ease forwards; }
  @keyframes to-right {
    from { left: 0; opacity: 1; }
    to { left: calc(100% - 48px); opacity: 1; }
  }
  @keyframes to-left {
    from { right: 0; opacity: 1; }
    to { right: calc(100% - 48px); opacity: 1; }
  }
  .toast { min-height: 1.4em; margin: 10px 0 0; color: var(--cyan); font-size: 14px; }
  .hidden { display: none; }
  .answer {
    margin-top: 14px;
    padding: 12px 14px;
    border-left: 3px solid var(--cyan);
    background: rgba(92, 225, 255, 0.08);
    border-radius: 0 12px 12px 0;
  }
  .steps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .step-btn, .nav button, .more, .reveal {
    border: 1px solid var(--line);
    background: rgba(8, 30, 46, 0.8);
    color: var(--ink);
    border-radius: 999px;
    padding: 6px 12px;
  }
  .step-btn.now, .nav button, .more, .reveal {
    border-color: var(--cyan);
    color: #041018;
    background: var(--cyan);
    font-weight: 700;
  }
  .nav button:disabled { opacity: 0.4; cursor: default; }
  .board { min-height: 150px; }
  .sentence { font-size: 22px; font-weight: 700; color: #9fdfff; }
  .chips, .vec { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip, .num {
    border-radius: 8px;
    padding: 4px 10px;
    font-weight: 700;
    animation: pop 0.35s ease both;
  }
  .chip { background: rgba(92, 225, 255, 0.16); color: #b9f3ff; }
  .num { background: rgba(141, 255, 168, 0.16); color: #c8ffd6; }
  @keyframes pop {
    from { transform: translateY(8px); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .grid { display: grid; grid-template-columns: repeat(6, 22px); gap: 4px; margin-top: 12px; }
  .cell { height: 22px; border-radius: 4px; animation: pop 0.3s ease both; }
  .tf {
    display: inline-block;
    margin-top: 12px;
    background: linear-gradient(90deg, #145a78, #1a3f88);
    border: 1px solid var(--cyan);
    border-radius: 10px;
    padding: 10px 16px;
    font-weight: 700;
  }
  .nav { display: flex; gap: 8px; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
  th { text-align: left; padding: 8px 10px; background: rgba(92, 225, 255, 0.16); }
  td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  tr.hide { display: none; }
  .cap { color: var(--muted); font-size: 13px; }
  a { color: var(--cyan); word-break: break-all; }
  ol { padding-left: 1.2em; }
  @media (max-width: 640px) {
    h1 { font-size: 32px; letter-spacing: 0.06em; }
    .api { grid-template-columns: 1fr; }
    .go { display: none; }
  }
</style>
</head>
<body>
<canvas id="water"></canvas>
<main class="wrap">
  <section class="view on" id="home">
    <p class="kicker">YU DINGYUE · 2608</p>
    <h1>AI带我学AI</h1>
    <p class="by">先只有问题。点开一句，再往下探索。</p>
    <div class="qlist" id="qlist"></div>
  </section>

  <section class="view" id="scene"></section>
</main>

<script>
  // 五个问句。首页只渲染这些，正文藏在点开之后。
  var questions = [
    { id: "api", no: "01", title: "什么是「API」？" },
    { id: "param", no: "02", title: "什么是「参数」和「参数量」？" },
    { id: "job", no: "03", title: "职场的「新手村」正在消失——吗？" },
    { id: "born", no: "04", title: "这些参数数字一开始是按什么规则产生的？" },
    { id: "rule", no: "05", title: "参数是依据什么规则被修改的？" }
  ];

  var home = document.getElementById("home");
  var scene = document.getElementById("scene");
  var qlist = document.getElementById("qlist");

  questions.forEach(function (q) {
    var btn = document.createElement("button");
    btn.className = "q";
    btn.type = "button";
    btn.innerHTML = '<span class="no">' + q.no + '</span><span>' + q.title + '</span><span class="go">进入</span>';
    btn.addEventListener("click", function (e) {
      dropRipple(e.clientX, e.clientY);
      openScene(q.id);
    });
    qlist.appendChild(btn);
  });

  function backHome() {
    scene.classList.remove("on");
    scene.innerHTML = "";
    home.classList.add("on");
    window.scrollTo(0, 0);
  }

  function shell(title, inner) {
    home.classList.remove("on");
    scene.classList.add("on");
    scene.innerHTML = '<button class="back" type="button" id="backBtn">返回问题</button><h2>' + title + '</h2>' + inner;
    document.getElementById("backBtn").addEventListener("click", backHome);
    window.scrollTo(0, 0);
  }

  function openScene(id) {
    if (id === "api") openApi();
    else if (id === "param") openParam();
    else if (id === "job") openJob();
    else if (id === "born") openBorn();
    else openRule();
  }

  function openApi() {
    shell("什么是「API」？",
      '<p>我原以为 API 是专属 AI 领域的术语。先把调用过程点一遍。</p>' +
      '<div class="panel"><h3>API调用过程</h3><div class="api">' +
      '<button class="node" id="cliBtn" type="button"><span class="prompt">&gt;_</span>LLM API CLI<small>点击发送指令</small></button>' +
      '<div class="lanes"><div class="lane go" id="laneGo"><span class="label">① 发送指令</span><span class="packet">指令</span></div>' +
      '<div class="lane back" id="laneBack"><span class="packet">答案</span><span class="label">③ 返回答案</span></div></div>' +
      '<button class="node server" id="srvBtn" type="button">☁ 云端大模型服务器<div class="model">大模型</div><small>点击返回答案</small></button>' +
      '</div><p class="toast" id="apiToast">先点左边的 LLM API CLI。</p></div>' +
      '<div class="answer hidden" id="apiAnswer"><p>首先，通过AI搜索，我纠正了一个误区——我原以为API是专属AI领域的术语，现在发现</p>' +
      '<p><strong>API是指“Application Programming Interface”也即应用程序编程接口，只要是软件之间约定好的通信规则都可以称为API。</strong></p>' +
      '<p>比如美团通过api向高德地图调取精准定位。而在AI领域，LLM API CLI通过API key调用云端大模型。</p></div>');
    var sent = false;
    document.getElementById("cliBtn").addEventListener("click", function () {
      sent = true;
      var go = document.getElementById("laneGo");
      document.getElementById("laneBack").classList.remove("fly");
      go.classList.remove("fly");
      void go.offsetWidth;
      go.classList.add("fly");
      this.classList.add("on");
      document.getElementById("apiToast").textContent = "指令已发出。再点右边的云端服务器，返回答案。";
    });
    document.getElementById("srvBtn").addEventListener("click", function () {
      if (!sent) {
        document.getElementById("apiToast").textContent = "还没发送指令。请先点左边的 LLM API CLI。";
        return;
      }
      var back = document.getElementById("laneBack");
      back.classList.remove("fly");
      void back.offsetWidth;
      back.classList.add("fly");
      this.classList.add("on");
      document.getElementById("apiToast").textContent = "云端大模型已返回答案。";
      document.getElementById("apiAnswer").classList.remove("hidden");
    });
  }

  function openParam() {
    shell("什么是「参数」和「参数量」？",
      '<p>我们喂给ai的训练材料都是文字，为什么最后衡量大模型的是“参数量”而不是“文字量”？</p>' +
      '<p><strong>我先询问了训练材料从文字变为参数的过程。</strong>点下一步，看它怎么走。</p>' +
      '<div class="panel"><h3>训练材料的参数化过程</h3><div class="steps" id="stepBtns"></div><div class="board" id="board"></div>' +
      '<div class="nav"><button type="button" id="prevStep">上一步</button><button type="button" id="nextStep">下一步</button></div></div>' +
      '<div class="answer hidden" id="paramAnswer"><p>训练材料首先被切割成词元，然后词元映射成向量，接着向量汇聚成矩阵，最后矩阵再通过transformer上下文训练对参数进行修改，至此，完成了一轮参数训练。</p>' +
      '<p>参数已经明确，那么参数量也水落石出。</p>' +
      '<p><strong>在参数化过程中，模型结构（有多少矩阵、矩阵有多大）决定了参数量。</strong></p>' +
      '<p>有两个有趣的点：</p><ol><li>参数没有明确的人类理解意义，不是词频，也不是频率</li>' +
      '<li>语义越相近的词元（token），这些词对应的向量就越接近。比如“昨天”和“今天”</li></ol></div>');
    bindSteps();
  }

  function bindSteps() {
    var tokens = ["我", "今天", "看到", "了", "一", "颗", "树"];
    var colors = ["#5ce1ff", "#8dffa8", "#7aa2ff", "#f6c56b", "#5ce1ff", "#8dffa8", "#7aa2ff"];
    var names = ["第一步 切割", "第二步 映射", "第三步 矩阵", "第四步 更新"];
    var step = 0;
    var stepBtns = document.getElementById("stepBtns");
    var board = document.getElementById("board");
    names.forEach(function (name, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "step-btn";
      b.textContent = name;
      b.addEventListener("click", function () { showStep(i); });
      stepBtns.appendChild(b);
    });
    function showStep(i) {
      step = i;
      stepBtns.querySelectorAll("button").forEach(function (b, idx) { b.classList.toggle("now", idx === i); });
      document.getElementById("prevStep").disabled = i === 0;
      document.getElementById("nextStep").disabled = i === names.length - 1;
      if (i === names.length - 1) document.getElementById("paramAnswer").classList.remove("hidden");
      if (i === 0) {
        board.innerHTML = '<div class="sentence">我今天看到了一颗树</div><div class="chips" id="chips"></div>';
        tokens.forEach(function (t, k) {
          var s = document.createElement("span");
          s.className = "chip";
          s.style.animationDelay = (k * 0.08) + "s";
          s.textContent = t;
          document.getElementById("chips").appendChild(s);
        });
      } else if (i === 1) {
        board.innerHTML = '<div>今天 → 查词表 → <strong>1024</strong></div><div class="vec" id="vec"></div><p class="cap">这个数再查嵌入矩阵，得到一条向量。</p>';
        ["0.2", "-0.1", "0.4", "…"].forEach(function (n, k) {
          var s = document.createElement("span");
          s.className = "num";
          s.style.animationDelay = (k * 0.1) + "s";
          s.textContent = n;
          document.getElementById("vec").appendChild(s);
        });
      } else if (i === 2) {
        board.innerHTML = '<div>所有 token 的向量叠成一张矩阵</div><div class="grid" id="grid"></div><p class="cap">单个 token 是向量，多个才是矩阵。</p>';
        var grid = document.getElementById("grid");
        for (var r = 0; r < 4; r++) {
          for (var c = 0; c < 6; c++) {
            var cell = document.createElement("i");
            cell.className = "cell";
            cell.style.background = colors[(r + c) % colors.length];
            cell.style.animationDelay = ((r * 6 + c) * 0.03) + "s";
            grid.appendChild(cell);
          }
        }
      } else {
        board.innerHTML = '<div>矩阵送进 Transformer，参数被改写</div><div class="tf">Transformer 上下文</div><p><strong>更新参数</strong></p>';
      }
    }
    document.getElementById("prevStep").addEventListener("click", function () { if (step > 0) showStep(step - 1); });
    document.getElementById("nextStep").addEventListener("click", function () { if (step < names.length - 1) showStep(step + 1); });
    showStep(0);
  }

  function openJob() {
    shell("职场的「新手村」正在消失——吗？",
      '<button class="reveal" id="showJudge" type="button">点开我的判断</button>' +
      '<div class="hidden" id="judgeBox"><div class="answer"><p><strong>我并不认同职场的新手村正在消失。</strong>因为</p>' +
      '<p><strong>我认为，新手村，也即初级岗位，本身就发生了改变。</strong></p>' +
      '<p>初级岗位从<strong>写代码、写综述、制作ppt和表格，</strong>变为了<strong>核对AI提供的事实出处、评测模型输出、标记复杂案例，</strong></p>' +
      '<p>虽然工作内容变了，但从性质上来说，这些工作在各自的时代视野下都属于初级岗位，是刚入职时有人带着做、可以试错的工作——</p></div>' +
      '<div class="panel"><p class="cap">依据对照。点一次，多看一行。</p><button class="more" id="moreEv" type="button">看下一条依据</button>' +
      '<table><thead><tr><th>依据</th><th>依据所指向的观点</th></tr></thead><tbody id="evBody">' +
      '<tr class="hide"><td>TikTok面向在校生招聘AI评估实习生，工作是复核AI判定、归类模型错误，并按案例修改提示词。</td><td>初级岗位的内容已变为复核与纠错，不再是从零撰写材料。</td></tr>' +
      '<tr class="hide"><td>MiniMax面向2026届校招AI评测开发工程师，工作是建立评测集，并指出模型短板。</td><td>初级工程岗已从手写代码，转为给模型做评测。</td></tr>' +
      '<tr class="hide"><td>Ignite IT招聘岗位标明初级、一至两年经验，工作是编写提示词并校验输出，复杂接入交由技术团队。</td><td>新工作仍由初级员工承担，独立部署不由新人单独完成。</td></tr>' +
      '</tbody></table></div>' +
      '<div class="answer"><p><strong>所以，与其说职场新手村正在消失，不如说旧的、过时的初级岗位已然消失，新的、ai时代下的初级岗位涌现出来。</strong></p>' +
      '<p>对于我们来说，我们不应着眼于旧初级岗位的消失，而应着眼于寻找挖掘新的初级岗位，并使自己具备AI时代下的工作能力与效率。</p>' +
      '<p>来源</p><ol><li>实习僧，TikTok「AI产品实习生（评估与标注质量方向）」，截止日期2026年10月4日。<br><a href="https://www.shixiseng.com/intern/inn_9bxa22k8pqn0">https://www.shixiseng.com/intern/inn_9bxa22k8pqn0</a></li>' +
      '<li>牛客网，MiniMax「AI评测开发工程师-2026届」。<br><a href="https://www.nowcoder.com/jobs/detail/429545">https://www.nowcoder.com/jobs/detail/429545</a></li></ol></div></div>');
    document.getElementById("showJudge").addEventListener("click", function () {
      document.getElementById("judgeBox").classList.remove("hidden");
      this.classList.add("hidden");
    });
    var rows = document.querySelectorAll("#evBody tr");
    var shown = 0;
    document.getElementById("moreEv").addEventListener("click", function () {
      if (shown >= rows.length) {
        rows.forEach(function (tr) { tr.classList.add("hide"); });
        shown = 0;
        this.textContent = "看下一条依据";
        return;
      }
      rows[shown].classList.remove("hide");
      shown += 1;
      if (shown >= rows.length) this.textContent = "收起依据";
    });
  }

  function openBorn() {
    shell("这些参数数字一开始是按什么规则产生的？",
      '<p>接着术语研究中的参数量话题，这是我还想追的第一问。</p>' +
      '<button class="reveal" id="showBorn" type="button">点开答案</button>' +
      '<div class="answer hidden" id="bornAnswer"><p>我获得的答案让我有点意外：</p>' +
      '<p><strong>1. 参数的初始产生是随机的且无意义，只需要遵循一些规则（如数值小一点）即可，是在不断训练中逐渐出现意义</strong></p></div>');
    document.getElementById("showBorn").addEventListener("click", function () {
      document.getElementById("bornAnswer").classList.remove("hidden");
      this.classList.add("hidden");
    });
  }

  function openRule() {
    shell("参数是依据什么规则被修改的？",
      '<p>也就是 transformer 这一过程发生了什么。我没有一次读完。</p>' +
      '<button class="reveal" id="showRule" type="button">点开我读到的链</button>' +
      '<div class="answer hidden" id="ruleAnswer"><p>2. transformer里过程有点复杂，并未完全读懂，包括</p>' +
      '<p id="chain"></p></div>');
    document.getElementById("showRule").addEventListener("click", function () {
      document.getElementById("ruleAnswer").classList.remove("hidden");
      this.classList.add("hidden");
      var bits = ["前向传播", "算损失", "反向传播", "更新参数", "重复亿万次"];
      var box = document.getElementById("chain");
      bits.forEach(function (bit, i) {
        setTimeout(function () {
          var s = document.createElement("strong");
          s.textContent = (i ? " → " : "") + bit;
          box.appendChild(s);
        }, i * 280);
      });
    });
  }

  // 水面：缓慢的波纹，再加上每次点击溅开的一圈
  var canvas = document.getElementById("water");
  var ctx = canvas.getContext("2d");
  var ripples = [];
  var dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
  }
  function dropRipple(x, y) {
    ripples.push({ x: x * dpr, y: y * dpr, r: 8 * dpr, a: 0.55 });
    if (ripples.length > 14) ripples.shift();
  }
  window.addEventListener("resize", resize);
  window.addEventListener("pointerdown", function (e) { dropRipple(e.clientX, e.clientY); });
  resize();
  setInterval(function () {
    dropRipple(window.innerWidth * (0.2 + Math.random() * 0.6), window.innerHeight * (0.25 + Math.random() * 0.5));
  }, 2600);
  function frame(t) {
    var w = canvas.width;
    var h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.lineWidth = 1.2 * dpr;
    for (var band = 0; band < 4; band++) {
      ctx.beginPath();
      var base = h * (0.58 + band * 0.08);
      for (var x = 0; x <= w; x += 10 * dpr) {
        var y = base + Math.sin(x * 0.008 / dpr + t * 0.001 + band) * (12 * dpr) + Math.sin(x * 0.02 / dpr - t * 0.0007) * (6 * dpr);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = "rgba(92, 225, 255, " + (0.05 + band * 0.02) + ")";
      ctx.stroke();
    }
    for (var i = ripples.length - 1; i >= 0; i--) {
      var rp = ripples[i];
      rp.r += 1.6 * dpr;
      rp.a *= 0.985;
      if (rp.a < 0.02) { ripples.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(140, 230, 255, " + rp.a + ")";
      ctx.stroke();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
